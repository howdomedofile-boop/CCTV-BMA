<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard เฝ้าระวังน้ำ - บางลำพู</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #1e1e1e; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px;
        }
        .cam-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .cam-box { 
            background: #000; 
            border: 2px solid #444; 
            border-radius: 8px; 
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            width: 480px; 
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* กำหนดให้รูปภาพขยายเต็มกรอบ */
        img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            .cam-box { width: 100%; height: 250px; }
        }
    </style>
</head>
<body>

    <h2>🌊 เฝ้าระวังระดับน้ำ เจ้าพระยา-บางลำพู</h2>
    
    <div class="cam-container">
        <div class="cam-box">
            <!-- ใส่ ID ให้รูปภาพ เพื่อให้สคริปต์ด้านล่างอ้างอิงได้ -->
            <img id="cam1369" src="" alt="กล้อง 1369">
        </div>
        <div class="cam-box">
            <img id="cam1194" src="" alt="กล้อง 1194">
        </div>
    </div>

    <script>
        function updateCameras() {
            // ดึงเวลาปัจจุบันมาสร้างเป็น Timestamp ใหม่
            const currentTime = new Date().getTime();
            
            // อัปเดต URL รูปภาพโดยต่อท้ายด้วยรหัสเวลาปัจจุบัน
            document.getElementById('cam1369').src = "http://bmatraffic.com/show.aspx?image=1369&time=" + currentTime;
            document.getElementById('cam1194').src = "http://bmatraffic.com/show.aspx?image=1194&time=" + currentTime;
        }

        // เรียกทำงานครั้งแรกทันทีที่เปิดเว็บ
        updateCameras();

        // ตั้งเวลาให้โหลดรูปใหม่ทุกๆ 60 วินาที (60000 มิลลิวินาที)
        setInterval(updateCameras, 60000);
    </script>
</body>
</html>
